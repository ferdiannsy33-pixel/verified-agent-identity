name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Ferdiannsy_'
        required: true
        default: 'Ferdiannsy_'
      agent_description:
        description: 'Ferdiannsy_ AI Agent'
        required: true
        default: 'Ferdiannsy_ AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "Ferdiannsy_", "description": "Ferdiannsy_ Agent"}'
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
