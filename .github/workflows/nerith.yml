name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Nama agent kamu'
        required: true
        default: 'Nerithjson'
      agent_description:
        description: 'Deskripsi singkat agent'
        required: true
        default: 'Nerithjson_ AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js --key <0xee38795fb2e0cec07a2e954f555364e6f98148d591f5c116d0cee02ad0f66895>

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "Nerithjson_", "description": "Nerithjson_ AI Agent"}'
